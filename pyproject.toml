[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thinfilm-optics"
version = "0.1.0"
description = "Transfer-matrix modelling of optical thin-film coatings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["thinfilm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
